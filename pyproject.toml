[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-linux-troubleshooter"
version = "1.0.0.dev0"
description = "Read-only manual Linux diagnostics with an offline troubleshooting catalog"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6,<7"]
# Distribution license intentionally undecided. See LICENSING_NOTES.md.

[tool.setuptools.packages.find]
include = ["universal_linux_troubleshooter*", "universal_linux_diagnostics"]

[project.scripts]
universal-linux-troubleshooter = "universal_linux_troubleshooter.__main__:main"

[tool.setuptools.package-data]
"universal_linux_troubleshooter.knowledge" = ["*.sqlite3"]
"universal_linux_troubleshooter" = ["assets/icons/*.png"]
